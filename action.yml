name: Terraform drift report
description: Parse a Terraform/OpenTofu plan JSON into drift counts and a changed-resource summary; optionally POST to a TSM callback.
author: sethbacon
branding:
  icon: activity
  color: purple

inputs:
  plan-json-file:
    description: Path to the plan JSON (output of `terraform show -json` / `tofu show -json`).
    required: true
  module-manifest:
    description: Path to the resolved module lockfile for locked versions.
    required: false
    default: .terraform/modules/modules.json
  include-module-provenance:
    description: >-
      Include module provenance in the report/callback. Both fields are
      PROJECTIONS, never the raw documents: `module_calls` forwards only each
      call's `source` and `version_constraint`, and `module_locks` only each
      lock's `Key`, `Source` and `Version` — with credentials stripped from
      every source address.
    required: false
    default: "true"
  fail-on-drift:
    description: Fail the step when drift is detected.
    required: false
    default: "false"
  detail:
    description: Free-text run label forwarded as the callback `detail` field.
    required: false
    default: ""
  commit-sha:
    description: >-
      Commit the plan was computed from, forwarded as the callback `commit_sha`
      field. Left empty (the default) it falls back to the runner's GITHUB_SHA —
      the commit the workflow ran on — so a stored report is tied to a tree
      without the workflow having to set anything. Set it only when the plan
      genuinely comes from a different commit.
    required: false
    default: ""
  callback-url:
    description: TSM drift callback URL. POST happens only if url and token are both set.
    required: false
    default: ""
  callback-token:
    description: Per-run one-shot TSM callback token (sent as X-TSM-Callback-Token).
    required: false
    default: ""
  ca-cert:
    description: >-
      PEM certificate(s) for the CA that issued the callback endpoint's TLS
      certificate, for a TSM endpoint fronted by a private CA. Trusting the CA
      keeps both certificate-chain and hostname verification on. When set, it
      replaces the default trust store for the callback request.
    required: false
    default: ""
  reject-unauthorized:
    description: >-
      REMOVED as a switch. Setting it to false disabled certificate AND hostname
      verification on the request carrying the per-run callback token, so a
      false value now fails the step. Use `ca-cert` instead.
    required: false
    default: "true"
  callback-allowed-hosts:
    description: >-
      Comma/newline-separated hosts the callback may be sent to, applied to the
      initial URL and to every redirect hop. A `*.` prefix matches exactly one
      label (`*.tsm.example.com`). When set, only these hosts are permitted —
      which is how a deliberately-private, self-hosted TSM endpoint stays
      reachable. When empty, any public host is permitted and private,
      link-local or otherwise reserved destinations are refused.
    required: false
    default: ""

outputs:
  drifted:
    description: '"true" when any non-no-op, non-read change was planned.'
  added:
    description: Count of resources whose plan contains a create.
  changed:
    description: Count of resources whose plan contains an update.
  destroyed:
    description: Count of resources whose plan contains a delete.
  summary-file:
    description: Path to the written JSON report (the exact callback body).

runs:
  using: node24
  main: dist/index.js
  # The report holds unredacted attribute values, so it is removed at job end
  # rather than left on the runner. Best-effort: it never fails the job.
  post: dist/cleanup.js
  post-if: always()
