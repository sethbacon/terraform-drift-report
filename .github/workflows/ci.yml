name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-test:
    name: Lint, test, dist sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Drives the REBUILT, MINIFIED bundle and observes what it does. --minify
      # strips names, so nothing about dist/ can be proven by reading it.
      - name: Behaviour of the built bundle
        run: npm run test:dist

      # Split from the staleness diff below so the two failures stay tellable
      # apart. "This bundle cannot be built at all" and "this bundle is fine but
      # the committed copy is behind it" need opposite responses, and collapsing
      # them onto one red step is exactly what made a mechanical dependency bump
      # read as a broken pull request and sit for a week.
      #
      # `npm run build` ends in scripts/verify-bundle.mjs, so a bundle carrying
      # an unresolved-module stub fails HERE and never reaches the diff below.
      # That ordering is load-bearing: the staleness gate compares dist/ to a
      # fresh build OF ITSELF, so it cannot tell a good bundle from a dead one,
      # and "rebuild and commit" would otherwise be sound advice that ships a
      # bundle throwing MODULE_NOT_FOUND at every consumer.
      - name: Rebuild the bundle
        id: rebuild
        run: npm run build

      - name: Fail if the committed dist is stale
        id: dist-sync
        # `git diff` compares TRACKED content only, so a file the build newly
        # emits into dist/ is invisible to it — and this build emits two entry
        # points plus a temporary dist/cleanup-build/ directory, so "the build
        # left something new behind" is a live shape here, not a hypothetical.
        # Stage the directory first and diff the INDEX so added, modified and
        # deleted paths are all caught; --force covers a path a .gitignore rule
        # (e.g. *.tsbuildinfo) would otherwise hide.
        run: |
          git add --force -A -- dist
          if ! git diff --cached --exit-code -- dist; then
            echo "::error::dist is out of date — run 'npm run build' and commit the result."
            exit 1
          fi

      # Dependabot edits package.json and the lockfile and never runs a build, so
      # every bundled-dependency bump arrives with a stale dist and is red by
      # construction. This step does not fix that; it says which of the two kinds
      # of red it is and what to do about it, in the log of the run that failed.
      #
      # Deliberately NOT a bot that rebuilds and pushes to the branch. The usual
      # recipe for that is `pull_request_target` with `contents: write`, which
      # runs the pull request's own code with a writable token against the base
      # repo — strictly worse than the problem it solves. The safe variant needs
      # a write-capable credential this repo does not have, and the GITHUB_TOKEN
      # variant cannot work at all here: a token-authored push produces no
      # `pull_request` event, so `Conventional PR Title` — a required check that
      # only that event creates — would never appear on the new head commit and
      # the PR would go from actionably red to permanently unmergeable. See
      # "Rebuilding dist/" in README.md.
      #
      # github.head_ref reaches the shell through env, never through `${{ }}`
      # interpolation into the script body: a branch name is attacker-chosen
      # text, and pasting it into a `run:` block is a shell-injection sink.
      - name: What to do about this Dependabot bump
        if: >-
          always() && github.actor == 'dependabot[bot]' &&
          (steps.rebuild.outcome == 'failure' || steps.dist-sync.outcome == 'failure')
        env:
          HEAD_REF: ${{ github.head_ref }}
          REBUILD: ${{ steps.rebuild.outcome }}
        run: |
          if [ "$REBUILD" = "failure" ]; then
            echo "::error::This bump does not merely need a rebuild — the bundle cannot be built from it. Either the TypeScript compile failed or the bundler could not resolve a dependency and emitted a throwing stub (see the 'Rebuild the bundle' step above for which). Committing a rebuilt dist/ here would ship an action that fails before it runs. Close the PR or pin the dependency until upstream is fixed."
          else
            echo "::notice::This bump builds cleanly and the rebuilt bundle passed verification — the only thing missing is the committed dist/. To land it: git fetch origin \"$HEAD_REF\" && git switch \"$HEAD_REF\" && npm ci && npm run build && git commit -am 'build: rebuild dist for this dependency bump' && git push"
          fi
