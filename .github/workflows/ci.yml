name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build-test:
    name: Lint, test, dist sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      # --coverage, with thresholds in vitest.config.mts. The two files carrying
      # the real risk — the orchestration in index.ts and the credential-bearing
      # transport in callback.ts — were at 0% for most of this action's life,
      # and nothing in CI would have said so.
      - run: npm run test:coverage
      # Drives the REBUILT, MINIFIED bundle and observes what it does. --minify
      # strips names, so nothing about dist/ can be proven by reading it.
      - name: Behaviour of the built bundle
        run: npm run test:dist

      - name: Rebuild bundle and fail if dist is stale
        run: |
          npm run build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist is out of date — run 'npm run build' and commit the result."
            exit 1
          fi
