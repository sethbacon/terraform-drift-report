---
# Delegates to the shared definition in 4cloudguru/shared-workflows.
#
# This was a 515-line local copy. SEVENTEEN repositories carried one, 263-716
# lines each, fifteen of them textually distinct -- but only SIX had distinct
# step sequences, and the set of repositories checked out is IDENTICAL in all
# sixteen consumers. The variation was ordering, prose, and drift.
#
# The drift was not harmless. azure-pipelines-terraform sat on actions/checkout
# v6.0.3 in EIGHTEEN places inside its copy while every other repo was on
# v7.0.1, and 4cloudguru/cloud-suite-ui was replaying origin/main instead of the
# pull request because its self-overwrite path was derived from the repository
# NAME, which stopped matching its scope.json directory when that repo was
# renamed. The shared definition resolves that directory from scope.json and
# fails hard if the caller is not in scope.
#
# TRIGGERS AND CONCURRENCY STAY HERE. They read `github.ref` and decide when
# this repository's replay runs, and keeping them visible is what makes it
# obvious the gate actually runs here rather than only centrally. The scheduled
# run cannot block a merge; this copy can, which is the whole reason each repo
# hosts one.
#
# PINNED BY SHA. `vars.SUITE_READ_APP_ID` resolves against THIS repository, so
# nothing about the App installation moves.
name: signature-replay

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    uses: 4cloudguru/shared-workflows/.github/workflows/signature-replay.yml@9276df8e0bdb3152e2529ab98c8b99cfb9e22d4b # v1.13.0
    # Exactly one secret, named. NOT `secrets: inherit`.
    secrets:
      SUITE_READ_APP_KEY: ${{ secrets.SUITE_READ_APP_KEY }}
